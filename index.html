<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091321"><title>Mystery Marble V16 — Player Silhouettes</title></head><body><main><header><h1>⚽ Mystery Marble <span>V16</span></h1><p>Footballers become moving marble silhouettes on a clean pitch.</p></header><section class="panel"><label class="file">1 · Choose football video <input id="file" type="file" accept="video/*"></label><div class="controls"><button id="detect" disabled>2 · Load player detector</button><button id="play" disabled>3 · Play marble video</button><button id="pause" disabled>Pause</button></div><p id="status" role="status">Choose a video to begin.</p><div id="progress" class="progress" hidden><div></div></div></section><section class="panel options"><label>Marble style<select id="style"><option value="solid">Solid</option><option value="flow">Flowing</option></select></label><label>Marble detail<select id="size"><option value="4">Fine (slower)</option><option value="6" selected>Balanced</option><option value="9">Large (faster)</option></select></label><label>Pitch<select id="pitch"><option value="green">Green</option><option value="dark">Dark</option></select></label><label>Detection strength<input id="threshold" type="range" min="20" max="85" value="45"></label></section><section class="panel"><div class="canvaswrap"><canvas id="out" width="540" height="960"></canvas></div><div class="controls"><button id="full">Expand preview</button><button id="record" disabled>Record WebM</button><button id="stop" disabled>Stop recording</button></div><p class="hint">First run needs internet to download the player model. The model detects people as a group and may miss distant players. Recording depends on browser support.</p></section><video id="video" playsinline muted preload="metadata"></video></main><script type="module" src="/src/main.js"></script></body></html>
